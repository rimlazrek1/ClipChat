<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Topics — Comment Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="stylesheet" href="/static/css/search.css" />
  <link rel="stylesheet" href="/static/css/topics.css" />
</head>
<body>

  <nav class="navbar" aria-label="Main navigation">
    <a href="/" class="navbar__logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
              stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Comment<span>Intel</span>
    </a>
    <ul class="navbar__links">
      <li><a href="/">Home</a></li>
      <li><a href="/search">Search</a></li>
      <li><a href="/topics" class="active">Topics</a></li>
      <li><a href="/analytics">Analytics</a></li>
      <li><a href="/topic-analytics">Topic Analytics</a></li>
    </ul>
  </nav>

  <main class="topics-page">

    <section class="search-header card">
      <div class="search-bar-row">
        <input id="searchInput" class="input" type="search"
               placeholder="Search comments by meaning… e.g. audio problems"
               autocomplete="off" />
        <button class="btn btn--primary" id="applyTopicsBtn" type="button">Apply</button>
      </div>

      <div class="filter-tabs" role="tablist" aria-label="Filter tabs">
        <button class="filter-tab active" data-filter="all"        role="tab" aria-selected="true">All</button>
        <button class="filter-tab"        data-filter="positive"   role="tab">Positive</button>
        <button class="filter-tab"        data-filter="neutral"    role="tab">Neutral</button>
        <button class="filter-tab"        data-filter="negative"   role="tab">Negative</button>
        <button class="filter-tab"        data-filter="questions"  role="tab">Viewer Questions</button>
        <button class="filter-tab"        data-filter="technical"  role="tab">Technical Issues</button>
      </div>

      <details class="extra-filters">
        <summary class="extra-filters__toggle">More filters</summary>
        <div class="extra-filters__body">
          <label class="filter-label">
            Min likes
            <input id="minLikes" class="input input--sm" type="number" min="0" placeholder="0" />
          </label>
          <label class="filter-label">
            From
            <input id="dateFrom" class="input input--sm" type="date" />
          </label>
          <label class="filter-label">
            To
            <input id="dateTo" class="input input--sm" type="date" />
          </label>
          <label class="filter-label" for="clusterCount">
            Groups
            <select id="clusterCount" class="input input--sm">
              <option value="3">3</option>
              <option value="5" selected>5</option>
              <option value="7">7</option>
              <option value="10">10</option>
            </select>
          </label>
          <button class="btn btn--ghost btn--sm" id="applyFilters" type="button">Apply</button>
          <button class="btn btn--ghost btn--sm" id="resetFilters" type="button">Reset</button>
        </div>
      </details>
    </section>

    <section class="topics-area" aria-live="polite" aria-label="Topic groups">

      <div class="state-msg card" id="noVideoMsg">
        <p>No video loaded. <a href="/" class="link-red">Go back and paste a link.</a></p>
      </div>

      <div class="state-msg hidden" id="loadingMsg">
        <div class="spinner"></div>
        <p class="text-muted mt-1">Grouping comments…</p>
      </div>

      <div class="state-msg card hidden" id="emptyMsg">
        <p class="text-muted">Not enough comments to build topics.</p>
      </div>

      <div class="results-meta hidden" id="resultsMeta">
        <span id="resultsCount"></span>
        <div class="results-meta__actions">
          <button class="btn btn--ghost btn--sm" id="analyzeBtn" type="button">Topic analytics</button>
          <div class="export-menu" id="exportMenu">
            <button class="btn btn--ghost btn--sm" type="button" data-export-toggle aria-expanded="false" aria-haspopup="true">Export</button>
            <div class="export-menu__list hidden" data-export-menu role="menu">
              <button class="export-menu__item" type="button" data-export-format="csv" role="menuitem">CSV</button>
              <button class="export-menu__item" type="button" data-export-format="pdf" role="menuitem">PDF</button>
            </div>
          </div>
        </div>
      </div>

      <div class="topic-list" id="topicList"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="alert" aria-live="polite"></div>
  <script src="/static/js/export.js"></script>
  <script src="/static/js/topics.js"></script>
</body>
</html>
